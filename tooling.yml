---
# Tool releases this integration was last reviewed against. Upkeep's drift job
# compares each with the newest release and hands a moved one to an agent to
# review, with the note below.
tools:
  - repo: anomalyco/opencode
    reviewed: v2.4.1
    tags: ^v2\.
    review: Check custom_components/opencode/api.py against the release's OpenAPI schema (opencode api get /openapi.json) and changelog. Cover pairing (/auth/connect and /api/pair), sessions and prompts, permission replies and the pending permission and form lists, interrupt, archive, /api/experimental/session/{id}/wait, and the event stream. Check the event types and fields entity.py reads (EVENT_TYPES and REQUEST_EVENT_TYPES in const.py), and the experimental client MCP WebSocket mcp.py serves (initialize, tools/list, tools/call and the ai.opencode/sessionID meta). Recheck the permission rules in entity.py, and the README's server setup, pairing steps and Locking an agent down config against the release's agents and permissions docs.
  - repo: home-assistant/core
    reviewed: 2026.11.2
    review: Check the integration against the release's breaking changes and the developer blog. Cover the conversation entity and ChatLog (async_provide_llm_data, async_add_delta_content_stream, external tool calls and thinking content), the AI task entity, the llm helpers mcp.py uses (async_get_api, APIInstance, LLMContext, MergedAPI and requires_admin), config subentries and their flows, and hassio discovery. Raise homeassistant in hacs.json if the integration starts needing the release.
