# The pinned tools and tasks for this integration. CI runs the shared
# workflows, and the hk pre-push hook runs the lints.
min_version = "2025.1.0"

[tools]
python = "3.14.10"
uv = "0.13.9"
hk = "2.13.0"
pkl = "0.33.1"
actionlint = "1.7.12"
shellcheck = "0.11.0"
"npm:markdownlint-cli2" = "0.24.2"
"pipx:yamllint" = "1.38.0"

[tasks.install]
description = "Install dependencies"
run = "uv sync --frozen"

[tasks.lint]
description = "Lint and check formatting with Ruff"
depends = ["install"]
run = ["uv run --no-sync ruff check", "uv run --no-sync ruff format --check"]

[tasks.format]
description = "Format and fix lint findings with Ruff"
depends = ["install"]
run = ["uv run --no-sync ruff format", "uv run --no-sync ruff check --fix"]

[tasks.test]
description = "Run the tests"
depends = ["install"]
run = "uv run --no-sync pytest"

[tasks.check]
description = "Lint, check formatting and test"
depends = ["lint", "test"]
